name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore MTPR.slnx
      - run: dotnet build MTPR.slnx --configuration Release --no-restore
      - run: dotnet test MTPR.slnx --configuration Release --no-build --no-restore
